name: Mobile CI

on:
  pull_request:
    paths:
      - "ui/**"
      - "supabase/migrations/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "supabase/migrations/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Expo lint and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  migration-baseline:
    name: Migration baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify initial migration is present
        run: test -f supabase/migrations/20260912000000_phase_0_foundation.sql
      - name: Reject accidental environment files
        run: |
          ! git ls-files | grep -E '(^|/).env($|\.)' | grep -vE '(^|/)\.env\.example$'
